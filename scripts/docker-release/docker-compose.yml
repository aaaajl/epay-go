# epay-go 发布部署（预构建镜像，复用 new-api 基础设施）
# 由 scripts/package-docker.sh 复制到 release/

name: epay-go

services:
  backend:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: epay-go:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-root}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-2026@Biscuits}
      DB_NAME: ${DB_NAME:-epay}
      DB_SSLMODE: disable
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-2026@Biscuits}
      REDIS_DB: ${REDIS_DB:-1}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      GIN_MODE: release
    ports:
      - "${HTTP_PORT:-3889}:8080"
    networks:
      - shared-infra
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-infra:
    external: true
    name: ${SHARED_NETWORK:-wingrid-api_new-api-network}
